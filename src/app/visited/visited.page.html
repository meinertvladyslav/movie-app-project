<ion-header>
  <ion-toolbar>
    <ion-title>Recently Viewed</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="4" *ngFor="let movie of visited">
        <ion-card>
          <ion-img [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path"></ion-img>
          <ion-card-header>
            <ion-card-title>{{ movie.title }} ({{ movie.year }})</ion-card-title>
          </ion-card-header>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
